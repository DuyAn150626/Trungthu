<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Trung Thu 3D</title>

    <!-- Google Fonts & FontAwesome -->
    <link href="https://googleapis.com" rel="stylesheet">
    <link rel="stylesheet" href="https://cloudflare.com">
    
    <!-- Giữ nguyên file css của bạn nằm trong thư mục tthu3d -->
    <link rel="stylesheet" href="tthu3d/assets/css.css">
</head>
<body>

    <div id="webgl-container"></div>

    <div class="top-bar">
        <button class="icon-btn" id="audio-btn" title="Bật/Tắt Nhạc"><i class="fas fa-music"></i></button>
        <button class="icon-btn" id="reset-cam-btn" title="Góc nhìn ban đầu"><i class="fas fa-compress-arrows-alt"></i></button>
    </div>

    <div class="click-hint">Chạm vào lồng đèn nhé</div>

    <div class="wish-modal" id="wishModal">
        <div class="wish-card">
            <button class="close-btn" id="closeWishBtn" aria-label="Đóng"><i class="fas fa-times"></i></button>
            <h3 id="wishTitle">Thông Điệp Gửi Cậu</h3>
            
            <div class="wish-image-container">
                <img id="wishImage" src="" alt="Hình ảnh Trung Thu">
            </div>

            <p id="wishText">"Chúc cậu một đêm Trung Thu ấm áp, bình an và trọn vẹn bên những người thương yêu."</p>
            <div class="tag">✦ Trung Thu An Lành ✦</div>
        </div>
    </div>

    <!-- Đường dẫn gọi file nhạc nền của bạn -->
    <audio id="bgm" loop src="tthu3d/assets/1.mp3"></audio>
    
    <!-- NHÚNG LINK THƯ VIỆN CHUẨN HTTPS TRỰC TUYẾN - KHÔNG BAO GIỜ BỊ TRÌNH DUYỆT CHẶN TRẮNG MÀN HÌNH -->
    <script src="https://cloudflare.com"></script>
    <script src="https://jsdelivr.net"></script>
    
    <!-- Gọi file logic chính xử lý thỏ ngọc, hòn đảo bay của bạn -->
    <script src="tthu3d/assets/script.js"></script>
</body>
</html>
